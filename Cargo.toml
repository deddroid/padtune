[package]
name = "bigbigctl"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png", "dep:gilrs"]

[[bin]]
name = "bigbigctl"
path = "src/main.rs"

[[bin]]
name = "bigbigctl-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
gilrs = { version = "0.11.2", optional = true }
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"


[[example]]
name = "live"
required-features = ["gui"]

[[example]]
name = "macro_rewrite"

[[example]]
name = "macro_xy"

[[example]]
name = "macro_clear"
