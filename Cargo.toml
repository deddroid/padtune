[package]
name = "padtune"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Unofficial configurator for BIGBIG WON controllers (Rainbow 2 Pro and family): buttons, sticks, triggers, lights, macros, polling rate"
license = "MIT"
authors = ["deddroid <deddo9412@gmail.com>"]
repository = "https://github.com/deddroid/padtune"
readme = "README.md"
keywords = ["gamepad", "controller", "bigbigwon", "hid", "configuration"]
categories = ["command-line-utilities", "hardware-support"]

[features]
default = ["gui"]
gui = [
    "dep:eframe",
    "dep:png",
    "dep:gilrs",
    "dep:interprocess",
    "dep:ksni",
    "dep:tokio",
    "dep:tray-icon",
    "dep:winreg",
    "dep:windows-sys",
]

[[bin]]
name = "padtune"
path = "src/main.rs"

[[bin]]
name = "padtune-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
gilrs = { version = "0.11.2", optional = true }
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
interprocess = { version = "2", optional = true }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"


[[example]]
name = "live"
required-features = ["gui"]

[[example]]
name = "macro_rewrite"

[[example]]
name = "macro_xy"

[[example]]
name = "macro_clear"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "time"], optional = true }

[target."cfg(windows)".dependencies]
tray-icon = { version = "0.26", optional = true }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"], optional = true }
winreg = { version = "0.56", optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
