[package]
name = "bigbigctl"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:png"]

[[bin]]
name = "bigbigctl"
path = "src/main.rs"

[[bin]]
name = "bigbigctl-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"], optional = true }
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
png = { version = "0.18", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"

