[package]
name = "bigbigctl"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "5"
hidapi = { version = "2", default-features = false, features = ["linux-static-hidraw"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "0.8"
