name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release --locked
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name=bigbigctl-${GITHUB_REF_NAME#v}-${{ matrix.target }}
          mkdir -p "$name/icons"
          cp target/release/bigbigctl target/release/bigbigctl-gui "$name/"
          cp LICENSE README.md README.it.md CHANGELOG.md install.sh "$name/"
          cp packaging/linux/70-bigbigctl.rules packaging/linux/bigbigctl.desktop "$name/"
          cp assets/icon.svg assets/icon-*.png "$name/icons/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "bigbigctl-$($env:GITHUB_REF_NAME.TrimStart('v'))-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/bigbigctl.exe, target/release/bigbigctl-gui.exe, LICENSE, README.md, README.it.md, CHANGELOG.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            bigbigctl-*.tar.gz*
            bigbigctl-*.zip*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            bigbigctl-*.tar.gz
            bigbigctl-*.tar.gz.sha256
            bigbigctl-*.zip
            bigbigctl-*.zip.sha256
          generate_release_notes: true
